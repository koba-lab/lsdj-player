<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; style-src 'self'; script-src 'self'">
  <title>LSDj Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="player">
      <div class="now">
        <div id="title" class="title">No song</div>
        <div id="sub" class="sub">Drop an .lsdprj / .lsdsng here, or open one</div>
      </div>
      <input id="seek" type="range" min="0" max="1000" value="0" disabled aria-label="Position">
      <div class="time"><span id="pos">0:00</span><span id="dur">0:00</span></div>
      <div class="controls">
        <button id="play" class="primary" disabled aria-label="Play">Play</button>
        <button id="stop" disabled>Stop</button>
        <label class="toggle"><input id="loop" type="checkbox"> Loop</label>
        <button id="open" class="push">Open…</button>
      </div>
      <div id="status" class="status" role="status"></div>
    </section>

    <section class="library">
      <h2>Renders</h2>
      <ul id="list"></ul>
      <p id="empty" class="muted">Nothing rendered yet.</p>
    </section>

    <details id="settings" class="settings">
      <summary>Settings</summary>
      <div class="row">
        <span class="label">LSDj ROM</span>
        <span id="rom" class="value mono">not set</span>
        <button id="chooseRom">Choose…</button>
      </div>
      <div class="row">
        <label class="label" for="max">Max length</label>
        <input id="max" class="mono" type="text" size="6" placeholder="3m">
        <span class="muted">for songs without HFF (e.g. 90s, 3m)</span>
      </div>
      <div class="row">
        <label class="toggle"><input id="autoReload" type="checkbox"> Re-render when the song file changes</label>
      </div>
    </details>
  </main>
  <audio id="audio" preload="auto"></audio>
  <script src="renderer.js"></script>
</body>
</html>
